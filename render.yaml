services:
  # --- Backend: Docker mode (robust for Render manual Docker service) ---
  - type: web
    name: energy-brain-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://energy-brain-frontend.onrender.com,http://localhost:5173,https://hackathon-energy-brain-frontend.onrender.com
      # Optional: add your keys in Render dashboard (do not commit secrets)
      # - key: NREL_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false

  # --- Frontend: Static SPA with rewrite ---
  - type: web
    name: energy-brain-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://energy-brain-backend.onrender.com

  # --- Alternative Python native backend (if you prefer buildpack, disable Docker one above) ---
